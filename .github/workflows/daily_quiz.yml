name: Daily Govt Exam Quiz

on:
  schedule:
    # Runs at 11:30 UTC daily = 5:00 PM IST (Asia/Kolkata)
    - cron: '30 11 * * *'
  workflow_dispatch: # Allows one-click manual testing from GitHub Actions tab

jobs:
  post-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit quiz_history.json back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Quiz Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python quiz_bot.py

      - name: Commit Updated Quiz History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update quiz history [skip ci]" && git push)
