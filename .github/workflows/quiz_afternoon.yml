name: Afternoon Quiz (12:30 PM IST)

on:
  schedule:
    # 12:28 PM IST = 06:58 UTC (avoiding top-of-hour congestion)
    - cron: '58 6 * * *'
  workflow_dispatch:

jobs:
  post-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Afternoon Quiz
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python quiz_bot.py

      - name: Commit Updated Quiz History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update quiz history after afternoon run [skip ci]" && git push)
